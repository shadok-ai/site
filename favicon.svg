<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The cockpit's own mark (public/index.html, .brand-logo), so the tab and
       the product show the same Shadok. Same geometry, explicit colours
       instead of currentColor, and thicker legs/antennae: at 16px a 0.9 stroke
       disappears. Not animated — browsers do not run SVG animation in a tab. -->
  <rect width="32" height="32" rx="7" fill="#08090D"/>
  <g transform="translate(16 16) scale(0.93) translate(-18.75 -16.6)"
     fill="#F5A524" stroke="#F5A524" stroke-width="1.6" stroke-linecap="round">
    <g>
      <line x1="13" y1="23" x2="12.6" y2="30.6"/>
      <line x1="11" y1="30.7" x2="14.1" y2="30.7"/>
    </g>
    <g>
      <line x1="18.6" y1="23" x2="19" y2="30.6"/>
      <line x1="17.6" y1="30.7" x2="20.7" y2="30.7"/>
    </g>
    <line x1="21.6" y1="17.2" x2="26" y2="20.4"/>
    <g stroke-width="1.1">
      <line x1="13.8" y1="5.4" x2="11.8" y2="2.8"/>
      <circle cx="11.8" cy="2.8" r="1.1" stroke="none"/>
      <line x1="18.2" y1="5.4" x2="20.2" y2="2.8"/>
      <circle cx="20.2" cy="2.8" r="1.1" stroke="none"/>
    </g>
    <circle cx="16" cy="16.2" r="8.4" stroke="none"/>
    <path d="M14.4 18.2 L17.6 18.2 L16 21.6 Z" stroke="none"/>
    <g stroke="none">
      <circle cx="13.1" cy="7.8" r="2.6" fill="#fff"/>
      <circle cx="18.9" cy="7.8" r="2.6" fill="#fff"/>
      <circle cx="13.4" cy="8.1" r="1.3" fill="#08090D"/>
      <circle cx="19.2" cy="8.1" r="1.3" fill="#08090D"/>
    </g>
  </g>
</svg>
